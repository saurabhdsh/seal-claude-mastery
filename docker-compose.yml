services:
  postgres:
    image: postgres:16-alpine
    container_name: seal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seal
      POSTGRES_PASSWORD: seal
      POSTGRES_DB: seal
    volumes:
      - seal_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seal -d seal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - seal

  redis:
    image: redis:7-alpine
    container_name: seal-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - seal_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - seal

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: seal-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      APP_URL: http://localhost:8080
      DATABASE_URL: postgresql://seal:seal@postgres:5432/seal?schema=public
      REDIS_URL: redis://redis:6379
      COOKIE_SECURE: "false"
      SEED_ON_START: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - seal

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: seal-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 6
    networks:
      - seal

volumes:
  seal_pg:
  seal_redis:

networks:
  seal:
    name: seal
